<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>
  :root {
    --bg: #fffdf8;
    --surface: #ffffff;
    --surface-2: #fff5d6;
    --border: #f1e3c2;
    --text: #2b2118;
    --muted: #5e5244;
    --accent: #f4b73a;
    --accent-strong: #a8470f;
    --accent-soft: #ffe8cf;
    --user-bg: #f39a4a;
    --user-text: #2b1708;
    --ok: #3f7d4a;
    --warn: #a8470f;
    --err: #c0392b;
    --shadow: 0 1px 2px rgba(120, 70, 10, .06), 0 4px 16px rgba(120, 70, 10, .06);
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #1f1a14; --surface: #29221a; --surface-2: #33291c; --border: #45382a;
    --text: #f5ecdc; --muted: #bcae98; --accent: #f4b73a; --accent-strong: #f7a868;
    --accent-soft: #40301a; --user-bg: #f39a4a; --user-text: #2b1708;
    --ok: #8cc596; --warn: #f7a868; --err: #ef7d6e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .logo { font-size: 22px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ready { background: var(--ok); }
  .dot.loading, .dot.busy { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot.error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 7px 12px; border-radius: 9px; font-size: 13.5px;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, var(--text)); }
  .icon-btn { border: none; background: none; color: var(--muted); padding: 6px; border-radius: 8px; font-size: 16px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  main { flex: 1; display: flex; min-height: 0; position: relative; padding-left: 66px; }
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 20px 12px; }
  /* before the first message: start screen, cards and chat bar centred in the page as one block */
  /* auto margins rather than justify-content: centred when it fits, scrollable (not cut off) when it doesn't */
  .chat.fresh { overflow-y: auto; }
  .chat.fresh #messages { flex: 0 0 auto; overflow: visible; padding-top: 0; margin-top: auto; }
  .chat.fresh .composer { margin-bottom: auto; }
  .chat.fresh #messages, .chat.fresh .composer { position: relative; top: -20px; }  /* sit slightly above centre */
  .chat.fresh .ltk { flex: none; margin-bottom: 200px; }  /* last in the column: bottom of the page, with a little room */
  .chat.fresh .empty { margin-top: 0; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: var(--radius); overflow-wrap: anywhere; }
  .user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .assistant .bubble p { margin: 0 0 .6em; } .assistant .bubble p:last-child { margin: 0; }
  .assistant .bubble ul, .assistant .bubble ol { margin: .2em 0 .6em; padding-left: 1.3em; }
  .assistant .bubble code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
  .offtopic .bubble { background: transparent; border-style: dashed; color: var(--muted); box-shadow: none; font-style: italic; }
  .error .bubble { border-color: var(--err); color: var(--err); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--muted); align-items: center; }
  .chip { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; font-family: var(--mono); font-size: 11.5px; }
  .chip.declined, .chip.error { color: var(--warn); border-color: var(--warn); }
  .chip.recalled { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .confirm { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; max-width: 85%; }
  .confirm h3 { margin: 0 0 6px; font-size: 14px; }
  .confirm pre { margin: 0 0 10px; font: 12px/1.45 var(--mono); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; overflow-x: auto; max-height: 240px; }
  .confirm .actions { display: flex; gap: 8px; }

  .empty { text-align: center; color: var(--muted); margin: 8vh auto 0; max-width: 460px; }
  .empty .big { font-size: 42px; }
  .empty h2 { color: var(--text); font-size: 20px; margin: 8px 0 4px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggestions button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
  .suggestions button:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* "You like to know": questions asked often, answered ahead of time */
  .ltk { width: calc(100% - 40px); max-width: 1100px; margin: 0 auto 20px; text-align: left; }
  .ltk h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 650; text-align: center; }
  .ltk-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1000px) { .ltk-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
  .ltk-card { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); text-align: left; color: var(--text); }
  .ltk-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .ltk-card { display: flex; flex-direction: column; justify-content: flex-start; }
  /* two lines kept for every question, so all answers start on the same line */
  .ltk-card .q { font-size: 12.5px; color: var(--muted); line-height: 1.35; min-height: 2.7em; }
  .ltk-card .a { font-size: 15.5px; font-weight: 600; line-height: 1.35; margin-top: 4px; }
  .composer { padding: 12px 20px 18px; }
  .composer form {
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
  }
  .composer form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text);
    font: inherit; max-height: 160px; padding: 6px 0; min-height: 24px;
  }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  .banner { max-width: 760px; margin: 0 auto 10px; border: 1px solid var(--err); color: var(--err); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; }
  .banner[hidden] { display: none; }
  .banner code { font-family: var(--mono); font-size: 12px; }


  /* menu: the same sections as the mobile app */
  /* collapsed to an icon rail; expands over the content while the mouse is on it */
  .menu {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 10; width: 66px; overflow: hidden;
    border-right: 1px solid var(--border); background: var(--surface);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 4px;
    transition: width .18s ease, box-shadow .18s ease;
  }
  .menu:hover, .menu:focus-within { width: 200px; box-shadow: var(--shadow); }
  .menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; border: none; background: none; color: var(--muted);
    padding: 10px 12px; border-radius: 10px; font-size: 15px; text-align: left; position: relative; white-space: nowrap;
  }
  .menu .label { opacity: 0; transition: opacity .12s ease; }
  .menu:hover .label, .menu:focus-within .label { opacity: 1; }
  .menu button:hover { background: var(--surface-2); color: var(--text); }
  .menu button.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .menu svg { width: 22px; height: 22px; flex: none; }
  .menu .badge {
    position: absolute; top: 5px; left: 30px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--err); color: #fff; font-size: 11.5px; line-height: 20px; font-weight: 700; text-align: center;
  }
  #frame { flex: 1; border: none; min-width: 0; background: var(--bg); }
  body:not([data-tab="chat"]) .chat, body:not([data-tab="chat"]) #end { display: none !important; }
  body[data-tab="chat"] #frame { display: none; }

  @media (max-width: 860px) {
    /* one row to swipe through, so the cards don't push the chat bar off screen */
    .ltk-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .ltk-card { flex: 0 0 78%; scroll-snap-align: start; }
    main { padding: 0 0 62px; }
    .menu, .menu:hover, .menu:focus-within {
      position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 62px; z-index: 15; box-shadow: none;
      flex-direction: row; gap: 0; padding: 0; border-right: none; border-top: 1px solid var(--border);
    }
    .menu button { flex: 1; flex-direction: column; gap: 2px; padding: 8px 0; font-size: 11px; border-radius: 0; text-align: center; }
    .menu button.active { background: none; }
    .menu .label { opacity: 1; }
    .menu .badge { position: absolute; top: 4px; left: calc(50% + 6px); margin: 0; min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; padding: 0 4px; }
    header { padding: 10px 16px; }
    #messages, .composer { padding-left: 16px; padding-right: 16px; }
    .msg, .confirm { max-width: 94%; }
    .status .label { display: none; }
  }
</style>
</head>
<body data-tab="chat">
<header>
  <span class="logo">🐝</span>
  <h1>Bee- Your Assistant</h1>
  <span class="status"><span id="dot" class="dot"></span><span id="status-label" class="label">Connecting…</span></span>
  <span class="spacer"></span>
  <button id="end" class="btn" title="Save this session into long-term memory and start a new one">Save &amp; new session</button>
  <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
</header>

<main>
  <nav class="menu" id="menu" aria-label="Sections">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.3 6L12 16.4 6.6 19.4l1.3-6L3.4 9.3l6-.7z"/></svg><span class="label">Highlights</span></button>
    <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="label">Chat</span></button>
    <button data-tab="convs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v18M8 7v10M4 10v4M16 7v10M20 10v4"/></svg><span class="label">Conversations</span></button>
    <button data-tab="todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="label">To-dos</span><span class="badge" id="todo-badge" hidden></span></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span class="label">Profile</span></button>
  </nav>
  <div class="chat fresh" id="chat">
    <div id="messages"><div class="inner" id="list">
      <div class="empty" id="empty">
        <div class="big">🐝</div>
        <h2>Ask about your day</h2>
        <div>Your assistant reads your Bee wearable data and remembers what you tell it across sessions.</div>
        <div class="suggestions">
          <button>Highlights of my day</button>
          <button>Any to-dos from today?</button>
          <button>What health data do I have today?</button>
          <button>What did I watch or listen to today?</button>
        </div>
      </div>
    </div></div>
    <div class="composer">
      <div id="banner" class="banner" hidden></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Message Bee…" autocomplete="off"></textarea>
        <button id="send" class="btn primary" type="submit">Send</button>
      </form>
      <div class="hint">Enter to send · Shift+Enter for a new line · Write actions always ask first</div>
    </div>
    <div class="ltk" id="ltk" hidden></div>
  </div>

  <iframe id="frame" title="Bee"></iframe>
</main>

<script>
const $ = (id) => document.getElementById(id);
const list = $("list"), scroller = $("messages"), input = $("input"), send = $("send");
let state = null, busy = false;

// ---- theme --------------------------------------------------------------
try { const t = localStorage.getItem("bee-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || "light";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("bee-theme", next); } catch {}
};

// ---- menu ---------------------------------------------------------------
// Chat is this page; the other sections are the mobile app's screens, shown in an
// embedded frame (mobile.html?embed=1) so both pages share one implementation.
const frame = $("frame");
function setTab(name, fromFrame = false) {
  document.body.dataset.tab = name;
  document.querySelectorAll("#menu button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  try { localStorage.setItem("bee-web-tab", name); } catch {}
  if (name === "chat") { input.focus(); return; }
  if (!frame.src) frame.src = `/mobile?embed=1&tab=${name}`;
  else if (!fromFrame) frame.contentWindow.postMessage({ beeTab: name }, location.origin);
}
document.querySelectorAll("#menu button").forEach((b) => b.onclick = () => setTab(b.dataset.tab));
// The agent may have saved to memory: the Profile section reloads it next time.
const memoryChanged = () => { if (frame.src) frame.contentWindow.postMessage({ beeMemoryChanged: true }, location.origin); };
addEventListener("message", (e) => {
  if (e.origin !== location.origin || e.source !== frame.contentWindow) return;
  if (e.data?.beeTab) setTab(e.data.beeTab, true);
  if (e.data?.beeDataDeleted) {
    list.innerHTML = "";
    addMessage("assistant", "Your data was deleted. Starting fresh.");
    refresh();
  }
  if (e.data?.beeBadge !== undefined) { $("todo-badge").hidden = !e.data.beeBadge; $("todo-badge").textContent = e.data.beeBadge; }
});

// ---- rendering helpers ----------------------------------------------------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}

// Small markdown subset: paragraphs, bullet and numbered lists, bold, code.
function md(text) {
  const out = []; let listType = null;
  const close = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const ul = line.match(/^[-*•]\s+(.*)/), ol = line.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const t = ul ? "ul" : "ol";
      if (listType !== t) { close(); out.push(`<${t}>`); listType = t; }
      out.push(`<li>${inline((ul || ol)[1])}</li>`);
    } else if (!line) { close(); }
    else { close(); out.push(`<p>${inline(line.replace(/^#+\s*/, ""))}</p>`); }
  }
  close();
  return out.join("");
}

function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

function addMessage(role, html, cls = "") {
  $("empty")?.remove();
  $("ltk")?.remove();  // start-screen cards; the chat takes over
  $("chat").classList.remove("fresh");  // chat bar back to the bottom
  const el = document.createElement("div");
  el.className = `msg ${role} ${cls}`;
  el.innerHTML = `<div class="bubble">${html}</div><div class="meta"></div>`;
  list.appendChild(el); scrollDown();
  return el;
}

function setMeta(el, job) {
  const recalled = (job.recalled || []).map((r) =>
    `<span class="chip recalled" title="Preloaded by the topic screen, P = ${r.p}">recalled · ${esc(r.topic)}</span>`);
  const parts = recalled.concat((job.tools || []).map((t) =>
    `<span class="chip ${t.status !== "success" ? esc(t.status) : ""}" title="${esc(t.status)}">${esc(t.name)}${t.status === "declined" ? " · declined" : ""}</span>`));
  if (job.tokens && job.tokens.input != null) parts.push(`<span>${job.tokens.input.toLocaleString()} in · ${job.tokens.output} out</span>`);
  el.querySelector(".meta").innerHTML = parts.join("");
}

// ---- jobs ----------------------------------------------------------------
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function follow(jobId, el) {
  let confirmEl = null;
  while (true) {
    await sleep(500);
    let job;
    try { job = await api(`/api/jobs/${jobId}`); } catch { continue; }
    if (el) setMeta(el, job);
    if (job.status === "confirm" && !confirmEl) {
      confirmEl = showConfirm(jobId, job.pending);
    } else if (job.status !== "confirm" && confirmEl) {
      confirmEl.remove(); confirmEl = null;
    }
    if (job.status === "done" || job.status === "error") return job;
  }
}

function showConfirm(jobId, pending) {
  const el = document.createElement("div");
  el.className = "confirm";
  const name = pending?.tool || "a tool";
  el.innerHTML = `<h3>⚠️ Bee wants to run <code>${esc(name)}</code></h3>
    <pre>${esc(JSON.stringify(pending?.args ?? {}, null, 2))}</pre>
    <div class="actions"><button class="btn primary" data-a="1">Allow</button><button class="btn" data-a="0">Decline</button></div>`;
  el.querySelectorAll("button").forEach((b) => b.onclick = async () => {
    el.querySelectorAll("button").forEach((x) => x.disabled = true);
    try { await api(`/api/jobs/${jobId}/confirm`, { allow: b.dataset.a === "1" }); }
    catch (e) { el.querySelectorAll("button").forEach((x) => x.disabled = false); }
  });
  // place the card just above the typing bubble
  const typing = list.lastElementChild;
  list.insertBefore(el, typing); scrollDown();
  return el;
}

function setBusy(v) {
  busy = v;
  updateControls();
}

function updateControls() {
  const ready = state?.status === "ready";
  send.disabled = busy || !ready || !input.value.trim();
  $("end").disabled = busy || !ready;
  input.disabled = !ready;
  input.placeholder = ready ? "Message Bee…" : state?.status === "error" ? "Assistant unavailable" : "Assistant is loading…";
}

async function sendMessage(text) {
  if (busy || !text.trim()) return;
  addMessage("user", esc(text));
  input.value = ""; autosize();
  const el = addMessage("assistant", `<span class="typing"><span></span><span></span><span></span></span>`);
  setBusy(true);
  try {
    const start = await api("/api/chat", { message: text });
    const job = await follow(start.id, el);
    const bubble = el.querySelector(".bubble");
    if (job.status === "error") { el.classList.add("error"); bubble.textContent = job.error; }
    else if (job.off_topic) { el.classList.add("offtopic"); bubble.innerHTML = `${esc(job.reply)} — this assistant only handles your Bee data and memory.`; }
    else bubble.innerHTML = md(job.reply || "(no reply)");
  } catch (e) {
    el.classList.add("error"); el.querySelector(".bubble").textContent = e.message;
  } finally {
    setBusy(false); refresh(); scrollDown(); input.focus(); memoryChanged();
  }
}

$("end").onclick = async () => {
  if (busy) return;
  setBusy(true);
  const btn = $("end"); const label = btn.textContent; btn.textContent = "Saving…";
  try {
    const start = await api("/api/session/end", {});
    const job = await follow(start.id, null);
    list.innerHTML = "";
    const el = addMessage("assistant", job.status === "error"
      ? esc("Session saved, but a new one could not start: " + job.error)
      : "Session saved to long-term memory. Starting fresh — what would you like to know?");
    if (job.status === "error") el.classList.add("error");
  } catch (e) { alertBanner(e.message); }
  finally { btn.textContent = label; setBusy(false); refresh(); memoryChanged(); }
};

// ---- composer ------------------------------------------------------------
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; updateControls(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(input.value); }
});
$("form").onsubmit = (e) => { e.preventDefault(); sendMessage(input.value); };
document.querySelectorAll(".suggestions button").forEach((b) => b.onclick = () => sendMessage(b.textContent));

// Questions the user asks often, with answers prepared once a day (likes_to_know.py).
// Shown on the chat start screen; tapping one asks Bee.
async function loadLikesToKnow() {
  const box = $("ltk");
  if (!box) return;
  let data;
  try { data = await api("/api/m/likes-to-know"); } catch { return; }
  if (!$("ltk") || !data.items.length) return;
  // One row for up to 5 questions, otherwise two even rows.
  const cols = data.items.length <= 5 ? data.items.length : Math.ceil(data.items.length / 2);
  box.innerHTML = `<h3>You like to know</h3><div class="ltk-grid" style="--cols:${cols}">${data.items.map((i) =>
    `<button class="ltk-card" title="Ask Bee"><div class="q">${esc(i.question)}</div><div class="a">${esc(i.answer || "…")}</div></button>`).join("")}</div>`;
  box.querySelectorAll(".ltk-card").forEach((b, n) => b.onclick = () => sendMessage(data.items[n].question));
  box.hidden = false;
}
loadLikesToKnow();

// ---- state -----------------------------------------------------
function alertBanner(msg, retry = false) {
  const b = $("banner");
  if (!msg) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span style="flex:1">${esc(msg)}</span>` + (retry ? `<button class="btn" id="retry">Retry</button>` : "");
  if (retry) $("retry").onclick = async () => { await api("/api/retry", {}); refresh(); };
}

async function refresh() {
  try {
    state = await api("/api/state");
  } catch {
    state = { status: "error", error: "Can't reach the server. Is server.py running?" };
  }
  const st = busy || state.busy ? "busy" : state.status;
  $("dot").className = "dot " + st;
  $("status-label").textContent = { ready: "Ready", busy: "Working…", loading: "Loading models…", error: "Unavailable" }[st];
  if (state.status === "error") alertBanner(state.error, !!state.memory);
  else alertBanner("");
  updateControls();
}

refresh();
try { setTab(localStorage.getItem("bee-web-tab") || "chat"); } catch { setTab("chat"); }
setInterval(() => { if (!busy) refresh(); }, 2000);
</script>
